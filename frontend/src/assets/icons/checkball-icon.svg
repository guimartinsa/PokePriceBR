<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <style>
    /* Animação para abrir a tampa */
    @keyframes openCap {
      0% { transform: translateY(0) rotate(0); }
      100% { transform: translateY(-15px) rotate(-15deg); }
    }
    /* Animação para o check aparecer */
    @keyframes showCheck {
      0% { opacity: 0; transform: scale(0) translateY(10px); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }
    
    .ball-top { animation: openCap 0.6s ease-out forwards; transform-origin: left center; }
    .check-mark { animation: showCheck 0.5s 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; transform-origin: center; }
  </style>

  <g stroke="#222224" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    
    <path d="M15 50 A 35 35 0 0 0 85 50" fill="#F0F0F0" />
    <line x1="15" y1="50" x2="85" y2="50" stroke-width="6" />

    <g class="check-mark">
      <circle cx="50" cy="50" r="15" fill="#EE1515" stroke="#222224" />
      <path d="M42 50 L48 56 L58 44" fill="none" stroke="white" stroke-width="4" />
    </g>

    <g class="ball-top">
      <path d="M15 50 A 35 35 0 0 1 85 50 Z" fill="#EE1515" />
      <circle cx="50" cy="50" r="10" fill="#222224" stroke="none"/>
      <circle cx="50" cy="50" r="6" fill="#F0F0F0" stroke="#222224" stroke-width="2"/>
    </g>
    
  </g>
</svg>