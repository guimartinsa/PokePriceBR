<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="240" height="200">
  <defs>
    <linearGradient id="lensReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1" />
    </linearGradient>
    <color id="pokeRed">#EE1515</color>
    <color id="pokeWhite">#F0F0F0</color>
    <color id="pokeBlack">#222224</color>
  </defs>

  <g stroke="#222224" stroke-width="3" stroke-linejoin="round">
    
    <clipPath id="camera-body-clip">
       <rect x="10" y="20" width="100" height="70" rx="15" ry="15"/>
    </clipPath>

    <rect x="10" y="20" width="100" height="35" fill="#EE1515" clip-path="url(#camera-body-clip)" stroke="none"/>
    
    <rect x="10" y="55" width="100" height="35" fill="#F0F0F0" clip-path="url(#camera-body-clip)" stroke="none"/>
    
    <rect x="10" y="50" width="100" height="10" fill="#222224" clip-path="url(#camera-body-clip)" stroke="none"/>

    <rect x="10" y="20" width="100" height="70" rx="15" ry="15" fill="none"/>

    <circle cx="95" cy="30" r="6" fill="#EE1515"/>
    <rect x="20" y="28" width="15" height="8" rx="2" fill="#AEEEEE"/>


    <g transform="translate(60, 55)">
      <circle cx="0" cy="0" r="22" fill="#222224"/>
      
      <circle cx="0" cy="0" r="14" fill="#F0F0F0" stroke-width="2"/>
      
      <circle cx="0" cy="0" r="8" fill="#FFFFFF" stroke-width="1"/>
      
      <path d="M -5 -3 A 6 6 0 0 1 3 -5" stroke="white" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round"/>
    </g>
  </g>
</svg>