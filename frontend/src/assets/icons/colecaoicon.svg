<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <color id="pokeRed">#EE1515</color>
    <color id="pokeWhite">#F0F0F0</color>
    <color id="pokeBlack">#222224</color>
  </defs>

  <g stroke="#222224" stroke-width="3" stroke-linejoin="round">
    
    <rect x="35" y="15" width="50" height="70" rx="3" fill="#D0D0D0" transform="rotate(10, 60, 50)"/>
    <rect x="30" y="12" width="50" height="70" rx="3" fill="#E0E0E0" transform="rotate(5, 55, 47)"/>

    <g>
      <rect x="25" y="10" width="50" height="70" rx="3" fill="#F0F0F0" stroke-width="4"/>
      
      <clipPath id="card-art-clip">
        <rect x="30" y="20" width="40" height="30" rx="2"/>
      </clipPath>

      <g clip-path="url(#card-art-clip)" stroke="none">
          <rect x="30" y="20" width="40" height="15" fill="#EE1515"/>
          <rect x="30" y="35" width="40" height="15" fill="#F0F0F0"/>
          <rect x="30" y="33" width="40" height="4" fill="#222224"/>
          <circle cx="50" cy="35" r="5" fill="#222224"/>
          <circle cx="50" cy="35" r="3" fill="#F0F0F0"/>
      </g>
      <rect x="30" y="20" width="40" height="30" rx="2" fill="none" stroke-width="2"/>
      
      <line x1="32" y1="60" x2="68" y2="60" stroke-width="2" stroke-linecap="round"/>
      <line x1="32" y1="68" x2="55" y2="68" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>